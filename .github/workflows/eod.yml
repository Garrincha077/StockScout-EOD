name: StockScout EOD

on:
  schedule:
    - cron: "45 20 * * 1-5"
    - cron: "45 21 * * 1-5"
  workflow_dispatch:
    inputs:
      scan_date:
        description: "Completed NYSE session (YYYY-MM-DD); blank selects the latest eligible session"
        required: false
        type: string
      notify:
        description: "Allow production Telegram delivery after every gate passes"
        required: false
        default: false
        type: boolean
      force:
        description: "Re-run a session that is already active"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stockscout-eod-production
  cancel-in-progress: false

env:
  PAGES_MANIFEST_URL: https://garrincha077.github.io/StockScout-EOD/data/manifest.json
  PAGES_APP_URL: https://garrincha077.github.io/StockScout-EOD/

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      should_run: ${{ steps.guard.outputs.should_run }}
      run_id: ${{ steps.identity.outputs.run_id }}
      session_date: ${{ steps.guard.outputs.session_date }}
      notify: ${{ steps.notify.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .

      - name: Guard completed NYSE session and run ledger
        id: guard
        shell: bash
        env:
          REQUESTED_DATE: ${{ inputs.scan_date }}
          FORCE_RUN: ${{ inputs.force }}
        run: |
          args=(guard --active-manifest "$PAGES_MANIFEST_URL")
          if [[ -n "$REQUESTED_DATE" ]]; then args+=(--requested-date "$REQUESTED_DATE"); fi
          if [[ "$FORCE_RUN" == "true" ]]; then args+=(--force); fi
          python -m stockscout_eod "${args[@]}"

      - name: Resolve immutable run identity
        id: identity
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: echo "run_id=${{ steps.guard.outputs.session_date }}-eod-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Resolve notification policy
        id: notify
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_NOTIFY: ${{ inputs.notify }}
          SCHEDULED_NOTIFY_ENABLED: ${{ vars.STOCKSCOUT_EOD_NOTIFY_ENABLED }}
        run: |
          enabled=false
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULED_NOTIFY_ENABLED" == "true" ]]; then
            enabled=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_NOTIFY" == "true" ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

      - name: Require protected production configuration
        if: steps.guard.outputs.should_run == 'true'
        env:
          STOCKSCOUT_EOD_PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: python -m stockscout_eod validate-browser-config

      - name: Restore private market cache directly through OIDC
        if: steps.guard.outputs.should_run == 'true'
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
        run: python -m stockscout_eod market-cache-restore --cache-dir data/cache --endpoint "$PUBLISH_URL"

      - name: Run deterministic EOD scan (outward sends disabled)
        if: steps.guard.outputs.should_run == 'true'
        run: >-
          python -m stockscout_eod scan
          --config config/eod.yaml
          --output .staging/scan.json
          --session-date "${{ steps.guard.outputs.session_date }}"
          --run-id "${{ steps.identity.outputs.run_id }}"
          --no-notify

      - name: Fail-closed freshness, coverage, schema and safety gate
        if: steps.guard.outputs.should_run == 'true'
        run: python -m stockscout_eod health --input .staging/scan.json

      - name: Run Ryan phase/Minervini confirmation (shadow only)
        if: steps.guard.outputs.should_run == 'true'
        run: >-
          python -m stockscout_eod legacy-shadow
          --input .staging/scan.json
          --config config/eod.yaml
          --output .staging/legacy-confirmation.json

      - name: Build private owner chart shards
        id: charts
        if: steps.guard.outputs.should_run == 'true'
        run: >-
          python -m stockscout_eod private-charts
          --input .staging/scan.json
          --config config/eod.yaml
          --output .staging/private-charts

      - name: Require 100% chart coverage for the published owner universe
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: test "${{ steps.charts.outputs.coverage_status }}" = "ready"

      - name: Publish private charts directly through OIDC
        if: steps.guard.outputs.should_run == 'true'
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
        run: >-
          python -m stockscout_eod publish-private-charts
          --staging-dir .staging/private-charts
          --run-id "${{ steps.identity.outputs.run_id }}"
          --endpoint "$PUBLISH_URL"

      - name: Build immutable derived-only public snapshot
        if: steps.guard.outputs.should_run == 'true'
        run: >-
          python -m stockscout_eod build
          --input .staging/scan.json
          --public-dir frontend/public
          --legacy-sidecar .staging/legacy-confirmation.json
          --previous-manifest "$PAGES_MANIFEST_URL"
          --public-base-url "${PAGES_APP_URL%/}"
          --owner-chart-status ready

      - name: Verify hashes, cardinality and public allowlist
        if: steps.guard.outputs.should_run == 'true'
        run: python -m stockscout_eod verify --public-dir frontend/public

      - name: Refresh the private market cache directly through OIDC
        if: steps.guard.outputs.should_run == 'true'
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
        run: |
          python -m stockscout_eod market-cache-build --cache-dir data/cache --output .staging/market-cache
          python -m stockscout_eod market-cache-publish --staging-dir .staging/market-cache --endpoint "$PUBLISH_URL"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.guard.outputs.should_run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build installable PWA
        if: steps.guard.outputs.should_run == 'true'
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm ci && npm run build

      - name: Prepare derived-only post-deploy payload
        if: steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p cloud-payload
          python -m stockscout_eod export-runtime-scan --input .staging/scan.json --output cloud-payload/scan.json
          cp -R frontend/public/data cloud-payload/data

      - name: Upload verified Pages artifact
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: frontend/dist

      - name: Upload short-lived sanitized cloud payload
        if: steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eod-sanitized-${{ steps.identity.outputs.run_id }}
          path: cloud-payload
          if-no-files-found: error
          retention-days: 2

      - name: Prepare safe diagnostics after a failed run
        if: failure() && steps.guard.outputs.should_run == 'true'
        shell: bash
        run: |
          mkdir -p diagnostic
          python -m stockscout_eod write-runtime-diagnostic --input .staging/scan.json --output diagnostic/health.json

      - name: Upload diagnostic artifact only
        if: failure() && steps.guard.outputs.should_run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: eod-diagnostic-${{ github.run_id }}
          path: diagnostic
          if-no-files-found: ignore
          retention-days: 2

  deploy:
    if: needs.build.outputs.should_run == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Atomically deploy the verified artifact
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  publish-and-notify:
    if: needs.build.outputs.should_run == 'true'
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: eod-sanitized-${{ needs.build.outputs.run_id }}
          path: cloud-payload

      - name: Verify the deployed Pages pointer is the same immutable run
        id: pages_verify
        continue-on-error: true
        run: >-
          python -m stockscout_eod verify-pages
          --public-dir cloud-payload
          --manifest-url "$PAGES_MANIFEST_URL"

      - name: Atomically activate the full ChatGPT scan index
        id: cloud_sync
        if: steps.pages_verify.outcome == 'success'
        continue-on-error: true
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
        run: python -m stockscout_eod publish-cloud --public-dir cloud-payload --endpoint "$PUBLISH_URL"

      - name: Evaluate idempotent owner EOD alerts
        if: steps.cloud_sync.outcome == 'success'
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
        run: python -m stockscout_eod evaluate-alerts --endpoint "$PUBLISH_URL"

      - name: Send resumable multipart Telegram digest
        if: always() && needs.build.outputs.notify == 'true'
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUD_STATUS: ${{ steps.cloud_sync.outcome == 'success' && 'synced' || 'failed' }}
        run: >-
          python -m stockscout_eod notify-telegram
          --input cloud-payload/scan.json
          --endpoint "$PUBLISH_URL"
          --cloud-sync-status "$CLOUD_STATUS"
          --report-link "$PAGES_APP_URL"
          --allow-notify

      - name: Prune abandoned uploads and non-active private chart runs
        if: always()
        continue-on-error: true
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
        run: python -m stockscout_eod cloud-cleanup --endpoint "$PUBLISH_URL"

      - name: Surface a stale ChatGPT index after Telegram has still delivered
        if: steps.pages_verify.outcome != 'success' || steps.cloud_sync.outcome != 'success'
        shell: bash
        run: exit 1

  cleanup-and-notify-failure:
    if: always() && needs.build.outputs.should_run == 'true' && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    needs: [build, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - name: Remove any newly orphaned private chart run
        continue-on-error: true
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
        run: python -m stockscout_eod cloud-cleanup --endpoint "$PUBLISH_URL"
      - name: Send one deduplicated operational error
        if: needs.build.outputs.notify == 'true'
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: >-
          python -m stockscout_eod notify-operational-error
          --endpoint "$PUBLISH_URL"
          --session-date "${{ needs.build.outputs.session_date }}"
          --message "GitHub Actions build/deploy failed; previous healthy scan remains active. Run $GITHUB_RUN_ID."
          --allow-notify
