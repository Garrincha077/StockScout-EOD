name: Promote legacy charts to public storage

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Exact healthy runId currently deployed on GitHub Pages"
        required: true
        type: string
      confirm:
        description: "Copy, verify, and remove the owner-prefixed legacy chart objects"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: stockscout-eod-production
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main' && inputs.confirm == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require the exact healthy Pages run
        env:
          EXPECTED_RUN_ID: ${{ inputs.run_id }}
          MANIFEST_URL: https://garrincha077.github.io/StockScout-EOD/data/manifest.json
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request

          expected = os.environ["EXPECTED_RUN_ID"]
          if not re.fullmatch(r"[A-Za-z0-9._:-]{1,100}", expected):
              raise SystemExit("run_id is invalid")
          request = urllib.request.Request(
              f"{os.environ['MANIFEST_URL']}?promote={time.time_ns()}",
              headers={"Cache-Control": "no-cache", "User-Agent": "StockScout-EOD-chart-promotion/1.0"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              manifest = json.load(response)
          if manifest.get("runId") != expected or manifest.get("status") != "healthy":
              raise SystemExit("requested run is not the currently deployed healthy Pages run")
          if manifest.get("chartStatus", manifest.get("ownerChartStatus")) != "ready":
              raise SystemExit("Pages did not mark this run's chart coverage ready")
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .

      - name: Promote the legacy chart run through the OIDC publisher
        env:
          PUBLISH_URL: ${{ vars.STOCKSCOUT_EOD_PUBLISH_URL }}
        run: >-
          python -m stockscout_eod promote-charts
          --run-id "${{ inputs.run_id }}"
          --endpoint "$PUBLISH_URL"

      - name: Verify every canonical chart shard without authentication
        env:
          EXPECTED_RUN_ID: ${{ inputs.run_id }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          run_id = os.environ["EXPECTED_RUN_ID"]
          expected_base = (
              os.environ["SUPABASE_URL"].rstrip("/")
              + f"/storage/v1/object/public/stockscout-eod-charts/{run_id}"
          )
          nonce = time.time_ns()
          with urllib.request.urlopen(f"{expected_base}/manifest.json?verify={nonce}", timeout=30) as response:
              manifest = json.load(response)
          if manifest.get("schemaVersion") != "stockscout-eod/charts-v1":
              raise SystemExit("canonical chart manifest schema is invalid")
          if manifest.get("runId") != run_id or manifest.get("storageBaseUrl") != expected_base:
              raise SystemExit("canonical chart manifest identity is invalid")
          if manifest.get("coveragePct") != 100 or manifest.get("requested") != manifest.get("available"):
              raise SystemExit("canonical chart coverage is incomplete")
          shards = manifest.get("shards")
          mapping = manifest.get("shardsByTicker")
          if not isinstance(shards, list) or not isinstance(mapping, dict):
              raise SystemExit("canonical chart shard contract is invalid")
          shard_names = {str(shard.get("name")) for shard in shards}
          if len(mapping) != manifest.get("available") or any(value not in shard_names for value in mapping.values()):
              raise SystemExit("canonical chart ticker map is incomplete")
          for shard in shards:
              name = str(shard["name"])
              request = urllib.request.Request(
                  f"{expected_base}/shards/{name}.json.gz?verify={nonce}",
                  method="HEAD",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status < 200 or response.status >= 300:
                      raise SystemExit(f"public chart shard {name} returned HTTP {response.status}")
                  length = response.headers.get("Content-Length")
                  if length is not None and int(length) != int(shard["bytes"]):
                      raise SystemExit(f"public chart shard {name} has the wrong byte size")
          print(f"verified {len(mapping)} public charts across {len(shards)} shards for {run_id}")
          PY
