name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      # The allowlisted production engine is byte-for-byte parity frozen. Lint
      # the public orchestration layer instead of mechanically rewriting it.
      - run: python -m ruff check src/stockscout_eod tests scripts
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/stockscout_mcp/package-lock.json
      - name: MCP contracts
        working-directory: services/stockscout_mcp
        run: npm ci && npm test && npm audit --audit-level=high
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Edge function format and contracts
        working-directory: supabase/functions/stockscout-eod-publish
        run: |
          deno fmt --check
          deno check index.ts
          deno test

  secret-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Reject runtime and credential artifacts
        shell: bash
        run: |
          unexpected_env="$(git ls-files ':(glob)**/.env' ':(glob)**/.env.*' | grep -Ev '(^|/)\.env\.example$' || true)"
          test -z "$unexpected_env"
          runtime_files="$(git ls-files 'data/**' 'reports/**' 'reports_benchmark/**' 'artifacts/**' 'cache/**' 'market-cache/**' 'cloud-payload/**' 'diagnostic/**' '*.duckdb' '*.duckdb.*' '*.parquet' '*.arrow' '*.feather' '*.sqlite' '*.sqlite3')"
          test -z "$runtime_files"
      - name: Scan every tracked file and commit for credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
